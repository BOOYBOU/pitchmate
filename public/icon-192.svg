<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Shield/Rounded Box -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#10B981" stroke-width="3" stroke-opacity="0.3"/>
  
  <!-- Soccer Ball & Pitch Geometry -->
  <g transform="translate(96, 96)" filter="url(#glow)">
    <!-- Pitch Outline Center Circle -->
    <circle r="52" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 3"/>
    <line x1="-56" y1="0" x2="56" y2="0" stroke="#10B981" stroke-width="2" stroke-opacity="0.4"/>
    
    <!-- Soccer Ball Silhouette -->
    <circle r="36" fill="#090D16" stroke="url(#emeraldGrad)" stroke-width="4"/>
    <polygon points="0,-14 13,-4 8,12 -8,12 -13,-4" fill="#10B981"/>
    <line x1="0" y1="-14" x2="0" y2="-28" stroke="#10B981" stroke-width="2"/>
    <line x1="13" y1="-4" x2="26" y2="-10" stroke="#10B981" stroke-width="2"/>
    <line x1="8" y1="12" x2="18" y2="24" stroke="#10B981" stroke-width="2"/>
    <line x1="-8" y1="12" x2="-18" y2="24" stroke="#10B981" stroke-width="2"/>
    <line x1="-13" y1="-4" x2="-26" y2="-10" stroke="#10B981" stroke-width="2"/>
  </g>
</svg>
