<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="emeraldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10B981" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background Shield/Rounded Box -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" stroke="#10B981" stroke-width="8" stroke-opacity="0.3"/>
  
  <!-- Soccer Ball & Pitch Geometry -->
  <g transform="translate(256, 256)" filter="url(#glow512)">
    <!-- Pitch Outline Center Circle -->
    <circle r="140" fill="none" stroke="#10B981" stroke-width="5" stroke-opacity="0.4" stroke-dasharray="10 8"/>
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#10B981" stroke-width="5" stroke-opacity="0.4"/>
    
    <!-- Soccer Ball Silhouette -->
    <circle r="96" fill="#090D16" stroke="url(#emeraldGrad512)" stroke-width="10"/>
    <polygon points="0,-38 35,-12 22,32 -22,32 -35,-12" fill="#10B981"/>
    <line x1="0" y1="-38" x2="0" y2="-75" stroke="#10B981" stroke-width="6"/>
    <line x1="35" y1="-12" x2="70" y2="-28" stroke="#10B981" stroke-width="6"/>
    <line x1="22" y1="32" x2="48" y2="65" stroke="#10B981" stroke-width="6"/>
    <line x1="-22" y1="32" x2="-48" y2="65" stroke="#10B981" stroke-width="6"/>
    <line x1="-35" y1="-12" x2="-70" y2="-28" stroke="#10B981" stroke-width="6"/>
  </g>
</svg>
